# Profile Gmail — gửi email thật tới hộp thư người được mời
# Chạy: set SPRING_PROFILES_ACTIVE=gmail (Windows) hoặc tạo application-local.properties

app.mail.enabled=true
app.mail.required=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

app.mail.from=${GMAIL_USERNAME:}
app.mail.from-name=Kanban App
