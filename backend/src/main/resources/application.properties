spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/kanban_db
spring.datasource.username=kanban_user
spring.datasource.password=kanban_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=KanbanSecretKeyVeryLongAndSecureStringForHS256Algorithm
app.jwt.expiration-ms=86400000