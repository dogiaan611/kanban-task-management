spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/kanban_db
spring.datasource.username=kanban_user
spring.datasource.password=kanban_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Dev: tự sửa checksum khi file migration thay đổi sau khi đã apply
spring.flyway.repair-on-migrate=true

# Tu dong nap cau hinh Gmail ca nhan (file gitignore, copy tu application-local.properties.example)
spring.config.import=optional:classpath:application-local.properties

app.jwt.secret=KanbanSecretKeyVeryLongAndSecureStringForHS256Algorithm
app.jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# Email — mặc định tắt (chỉ thông báo in-app). Bật Gmail: xem application-gmail.properties
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

app.frontend-url=http://localhost:5173
app.mail.from=kanban@localhost
app.mail.from-name=Kanban
app.mail.enabled=false
# true = báo lỗi nếu gửi email thất bại (dùng cùng profile gmail)
app.mail.required=false